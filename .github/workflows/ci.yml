name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    analyze:
        name: Analyze and Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.3

            - name: Setup Flutter
              uses: subosito/flutter-action@v2.22.0
              with:
                  cache: true

            - name: Prepare env files for analyze
              run: |
                  cp .env.dev.example .env.dev
                  cp .env.staging.example .env.staging
                  cp .env.production.example .env.production

            - name: Install dependencies
              run: flutter pub get

            - name: Verify formatting
              run: dart format --output=none --set-exit-if-changed .

            - name: Analyze code
              run: flutter analyze

            - name: Run tests
              run: flutter test --coverage

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5.5.5
              with:
                  files: coverage/lcov.info
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false

    build-ios:
        name: Build iOS
        runs-on: macos-latest
        needs: analyze
        environment: staging

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.3

            - name: Setup Flutter
              uses: subosito/flutter-action@v2.22.0
              with:
                  cache: true

            - name: Prepare env files for build
              env:
                  AUTH_DOMAIN: ${{ secrets.AUTH_DOMAIN }}
                  AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
                  AUTH_AUDIENCE: ${{ secrets.AUTH_AUDIENCE }}
                  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
              run: |
                  cp .env.dev.example .env.dev
                  cp .env.production.example .env.production
                  # Staging config from the 'staging' environment secrets
                  {
                    echo "AUTH_DOMAIN=${AUTH_DOMAIN}"
                    echo "AUTH_CLIENT_ID=${AUTH_CLIENT_ID}"
                    echo "AUTH_AUDIENCE=${AUTH_AUDIENCE}"
                    echo "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}"
                  } > .env.staging
                  # Writes ios/Flutter/Secrets.xcconfig (Maps key) from .env.staging
                  ./scripts/sync_ios_secrets.sh staging
                  # Placeholder Firebase config (gitignored); enough to compile, not to ship
                  cp ios/GoogleService-Info.plist.example ios/GoogleService-Info.plist

            - name: Install dependencies
              run: flutter pub get

            - name: Build iOS (no codesign)
              run: flutter build ios --release --no-codesign --dart-define=ENVIRONMENT=staging --dart-define-from-file=.env.staging

    build-android:
        name: Build Android
        runs-on: ubuntu-latest
        needs: analyze
        environment: staging

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.3

            - name: Setup Flutter
              uses: subosito/flutter-action@v2.22.0
              with:
                  cache: true

            - name: Setup Java
              uses: actions/setup-java@v5.2.0
              with:
                  distribution: 'zulu'
                  java-version: '17'

            - name: Prepare env files for build
              env:
                  AUTH_DOMAIN: ${{ secrets.AUTH_DOMAIN }}
                  AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
                  AUTH_AUDIENCE: ${{ secrets.AUTH_AUDIENCE }}
                  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
              run: |
                  cp .env.dev.example .env.dev
                  cp .env.production.example .env.production
                  # Staging config from the 'staging' environment secrets
                  {
                    echo "AUTH_DOMAIN=${AUTH_DOMAIN}"
                    echo "AUTH_CLIENT_ID=${AUTH_CLIENT_ID}"
                    echo "AUTH_AUDIENCE=${AUTH_AUDIENCE}"
                    echo "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}"
                  } > .env.staging
                  # Placeholder Firebase config (gitignored); enough to compile, not to ship
                  cp android/app/google-services.json.example android/app/google-services.json

            - name: Install dependencies
              run: flutter pub get

            - name: Build Android APK
              env:
                  # Manifest placeholders; release builds refuse to fall back to a dev tenant
                  AUTH0_DOMAIN: ${{ secrets.AUTH_DOMAIN }}
                  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
              run: flutter build apk --release --dart-define=ENVIRONMENT=staging --dart-define-from-file=.env.staging

            - name: Upload APK artifact
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: app-release-apk
                  path: build/app/outputs/flutter-apk/app-release.apk
